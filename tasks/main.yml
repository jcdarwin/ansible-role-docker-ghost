---
# tasks file for ansible-role-docker-ghost

# - name: Show the result of our vars
#   debug: var=ghost
#   tags:
#   - traefik
#   - ghost
#   - docker

- name: Ensure ghost directories exist
  file:
    path: "{{ item }}"
    state: directory
  with_items:
  - "{{ ghost.install_dir }}"
  - "{{ ghost.install_dir }}/content"
  tags:
  - traefik
  - ghost
  - docker

# Presumes we've run ansible-role-users to create our git config
- name: ensure our git checkout exists
  git:
    repo: "{{ ghost.remote }}"
    dest: "{{ ghost.install_dir }}/content"
    update: no
    accept_hostkey: yes
  tags:
  - traefik
  - ghost
  - docker

- name: add our git push script
  template: >
    src=../templates/git_push.sh.j2
    dest="{{ ghost.install_dir }}/content/git_push.sh"
    mode=0755
  tags:
  - traefik
  - ghost
  - docker

# https://hub.docker.com/_/ghost
- name: Deploy ghost blog container
  docker_container:
    name: ghost
    image: ghost:6.65.0-alpine
    restart_policy: unless-stopped
    # Starting a container can take over the 60s default on a small droplet
    timeout: 180
    volumes:
    - /etc/localtime:/etc/localtime:ro
    - /etc/ghost/content:/var/lib/ghost/content
    env:
      url: "https://{{ ghost.domain }}"
      NODE_ENV: production
      database__client: sqlite3
      database__connection__filename: /var/lib/ghost/content/data/ghost.db
      mail__transport: "{{ ghost.mail.transport }}"
      mail__from: "{{ ghost.mail.from }}"
      mail__options__service: "{{ ghost.mail.smtp_service }}"
      mail__options__auth__user: "{{ ghost.mail.user }}"
      mail__options__auth__pass: "{{ ghost.mail.pass }}"
    labels:
      traefik.enable: "true"
      traefik.backend: ghost
      traefik.frontend.rule: "Host:{{ ghost.domain }}"
      traefik.port: "2368"
      com.datadoghq.ad.logs: '[{"source": "do.mebooks.co.nz", "service": "ghost"}]'
  tags:
  - traefik
  - ghost
  - docker

# The content repo is owned by deploy (UID 1000, also the container's node
# user) but the cron job runs git as root, which git refuses without this.
- name: Let root's git operate on the content repo
  community.general.git_config:
    name: safe.directory
    value: "{{ ghost.install_dir }}/content"
    scope: global
    add_mode: add
  tags:
  - traefik
  - ghost
  - docker

# ###############
# # cron jobs
- name: Set a daily cron job to git push any changes
  action: template
    src=templates/cron_git_push.j2
    dest=/etc/cron.daily/cron_git_push
    mode=0755
  tags:
  - traefik
  - ghost
  - docker

- name: Check that our cron is valid
  command: run-parts --test --verbose /etc/cron.daily
  register: result
  tags:
  - traefik
  - ghost
  - docker

- name: Show the result of our cron
  debug: var=result
  tags:
  - traefik
  - ghost
  - docker
